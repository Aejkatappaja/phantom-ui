name: CI

on:
  push:
    branches: [main]
  # Not just [main]: a stacked PR targets the branch below it, and would
  # otherwise run no checks at all until the one below it merges.
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build

  examples:
    name: Build examples
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [react-app, vue-app, solid-app, qwik-app, angular-app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # They resolve phantom-ui through `file:../..`, so they only catch
      # regressions once dist/ has been built.
      - run: bun run build
      - run: cd examples/${{ matrix.app }} && bun install
      - run: cd examples/${{ matrix.app }} && bun run build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun add --no-save @rollup/rollup-linux-x64-gnu
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('bun.lock') }}
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: bun run test:cli
      - run: bun run test:all
      # Enforces the thresholds in web-test-runner.config.mjs. Chromium only:
      # the figure is identical across browsers.
      - run: bun run test:coverage

  build-docs:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: cd docs && bun install --frozen-lockfile
      - name: Sync demo CDN bundle
        run: cd docs && node scripts/sync-cdn.mjs
      - name: Generate changelog
        run: cd docs && node scripts/generate-changelog.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: cd docs && bunx astro build
