name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      # contents: write so the vendorable files can be attached to the release.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run build
      # npm tags every publish `latest` by default, including versions carrying a
      # prerelease identifier. Publishing 1.5.0-beta.0 through this workflow would
      # hand it to everyone running a plain install. The tag follows the GitHub
      # release's own prerelease flag instead, so there is nothing to remember at
      # publish time.
      - name: Publish
        run: npm publish --access public --provenance --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ github.event.release.prerelease && 'beta' || 'latest' }}
      # Some users cannot reach a registry at all, so the files they would vendor are
      # attached to the release itself. GitHub is reachable where npm often is not.
      - name: Attach the vendorable files to the release
        run: >
          gh release upload "${{ github.event.release.tag_name }}"
          dist/phantom-ui.standalone.js
          dist/phantom-ui.standalone.dev.js
          dist/phantom-ui.standalone.d.ts
          --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
