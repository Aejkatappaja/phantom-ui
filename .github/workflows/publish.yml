name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      # contents: write so the vendorable files can be attached to the release.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run build
      # npm tags every publish `latest` by default, including versions carrying a
      # prerelease identifier. Publishing 1.5.0-beta.0 through this workflow would
      # hand it to everyone running a plain install. The tag follows the GitHub
      # release's own prerelease flag instead, so there is nothing to remember at
      # publish time.
      - name: Publish
        run: npm publish --access public --provenance --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ github.event.release.prerelease && 'beta' || 'latest' }}
      # Some users cannot reach a registry at all, so the files they would vendor are
      # attached to the release itself. GitHub is reachable where npm often is not.
      #
      # TypeScript pairs a declaration file to a module by exact filename, so whichever
      # build someone vendors has to be named phantom-ui.standalone.js for the .d.ts to
      # apply. This channel exists for people who must read what they are approving, so
      # the readable build takes that name and the minified one is suffixed. Renaming
      # happens here rather than in dist/, where both builds coexist and are resolved
      # through the exports map instead.
      - name: Attach the vendorable files to the release
        run: |
          mkdir -p vendor
          cp dist/phantom-ui.standalone.dev.js vendor/phantom-ui.standalone.js
          cp dist/phantom-ui.standalone.js vendor/phantom-ui.standalone.min.js
          cp dist/phantom-ui.standalone.d.ts vendor/phantom-ui.standalone.d.ts
          gh release upload "${{ github.event.release.tag_name }}" vendor/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
